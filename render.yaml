# Render 部署配置（免费 Web Service）
#
# ⚠️ **本文件当前不作为部署入口使用** —— 走 Blueprint 创建服务时 Render 会拉起
# Stripe 的 "Add Card" 身份验证弹窗（$1 临时授权），无法跳过。
# 但那只是 **Blueprint 路径特有**的：Render 官方 FAQ 明确免费实例无需绑卡
# （"不加卡，免费实例照样能用"），改走 Dashboard → New + → Web Service 即可绕过。
#
# 详见 W06_DEPLOY.md §二。
#
# 平台选择理由（见 W06_DEPLOY.md）：
# - 不用 Render 免费 PostgreSQL：创建 30 天后删除 —— 11 月建库正好在评审期
#   （12-01 ~ 12-15）内失效（R-09）
# - 不用 Supabase 免费层：7 天无活动即暂停，需手动恢复
# - 不用 Zeabur：2026-10-24 已宣布停运，12-01 起暂停共享集群服务
# - 用 Neon 免费项目：数据库不会自动删除（只休眠），且提供连接串
#
# 若日后要恢复 IaC 部署（且已解决卡片问题），本文件可直接使用：
# Render Dashboard → New → Blueprint → 选本仓库 → Apply
# 敏感环境变量全部 sync: false 手动填。

services:
  - type: web
    name: mandatepay
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # 健康检查用 /healthz（零 DB 零 PayPal 的轻量存活探针），
    # 而不是 /api/health —— 后者会 import agent.store 并报告后端类型，
    # 对"服务是否活着"这个判断是多余开销。W-07 加的端点。
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── 数据库（Neon 免费项目）──────────────────────────
      - key: DATABASE_URL
        sync: false
      # ── PayPal 沙箱 ─────────────────────────────────────
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # ── LLM（任意 OpenAI 兼容端点）────────────────────────
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: LLM_MODEL
        value: glm-4.7-flash
      - key: LLM_THINKING
        value: disabled
