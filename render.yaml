# Render 部署配置（免费 Web Service）
#
# ⚠️ **本文件当前不作为部署入口使用。**
#
# 实测结论（2026-11-08，详见 W06_DEPLOY.md §2.1）：
# Render 对**新注册账号**强制 Stripe 身份验证（"Add Card"，$1 临时授权）。
# 这**不是 Blueprint 路径特有**的 —— 走 Dashboard → New + → Web Service 的手动路径，
# 用户实测走到**最后一步 "Deploy Web Service" 时仍被要求填卡**，无法跳过。
# 属账号级风控，不是某条部署路径的问题。
#
# ⚠️ 因此**不要**按"改走手动创建就能绕过"的说法操作 —— 那条路同样走不通。
#    当前实际部署平台是 **Azure App Service B1**（Azure for Students 官方免卡）。
#
# 保留本文件的原因：日后若解决卡片问题（例如换用已绑卡的账号），
# 可直接 New → Blueprint → Apply 恢复声明式部署。敏感环境变量全部 sync: false。
#
# 平台选择理由（见 W06_DEPLOY.md）：
# - 不用 Render 免费 PostgreSQL：创建 30 天后删除 —— 11 月建库正好在评审期
#   （12-01 ~ 12-15）内失效（R-09）
# - 不用 Supabase 免费层：7 天无活动即暂停，需手动恢复
# - 不用 Zeabur：2026-10-24 已宣布停运，12-01 起暂停共享集群服务
# - 不用 Railway：注册入口已关闭
# - 用 Neon 免费项目：数据库不会自动删除（只休眠），且提供连接串
#
# 若日后要恢复 IaC 部署（且已解决卡片问题），本文件可直接使用：
# Render Dashboard → New → Blueprint → 选本仓库 → Apply
# 敏感环境变量全部 sync: false 手动填。
# 环境变量清单用 `python scripts/gen_deploy_env.py --database-url <连接串>` 生成。

services:
  - type: web
    name: mandatepay
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # 健康检查用 /healthz（零 DB 零 PayPal 的轻量存活探针），
    # 而不是 /api/health —— 后者会 import agent.store 并报告后端类型，
    # 对"服务是否活着"这个判断是多余开销。W-07 加的端点。
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── 数据库（Neon 免费项目）──────────────────────────
      - key: DATABASE_URL
        sync: false
      # ── PayPal 沙箱 ─────────────────────────────────────
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # ── 会话签名密钥（W-08 鉴权）─────────────────────
      # 不配也能跑（会从 PAYPAL_CLIENT_SECRET 派生），但配了更干净 ——
      # 避免将来轮换 PayPal 凭据时连带让所有会话失效。
      # 生成：python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: SESSION_SECRET
        sync: false
      # ── LLM（任意 OpenAI 兼容端点）────────────────────────
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: LLM_MODEL
        value: glm-4.7-flash
      - key: LLM_THINKING
        value: disabled
