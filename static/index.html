<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="MandatePay · PayPal Sandbox Checkout" data-zh="MandatePay · 沙箱支付测试">MandatePay · PayPal Sandbox Checkout</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1a2433; }
    h1 { font-size: 22px; color: #003087; }
    #status { margin-top: 16px; padding: 10px 12px; border-radius: 6px; background: #f0f4fa; font-size: 14px; white-space: pre-wrap; }
    nav.top { margin-bottom:16px; font-size:14px; }
    nav.top a { color:#0070ba; margin-right:16px; text-decoration:none; }
    nav.top a:hover { text-decoration:underline; }
    nav.top a.current { color:#1a2433; font-weight:600; }
  </style>
</head>
<body>
  <nav class="top"><a class="current" href="/" data-en="Pay" data-zh="支付测试">· Pay 支付测试</a><a href="/constraints" data-en="Constraints" data-zh="约束设定">· Constraints 约束设定</a><a href="/budget" data-en="Budget" data-zh="预算仪表盘">· Budget 预算仪表盘</a><a href="/approvals" data-en="Approvals" data-zh="审批台">· Approvals 审批台</a><a href="/audit" data-en="Audit" data-zh="审计日志">· Audit 审计日志</a><a href="https://github.com/niu602/mandatepay" target="_blank" rel="noopener" data-en="Source" data-zh="源码">· Source 源码</a></nav>
  <h1 data-en="MandatePay · PayPal Sandbox Checkout" data-zh="MandatePay · 沙箱支付测试">MandatePay · PayPal Sandbox Checkout 沙箱支付测试</h1>
  <p data-en="Amount: $10.00 USD (change it in the /api/create-order request body)" data-zh="金额：$10.00 USD（可在 /api/create-order 入参中修改）">Amount: $10.00 USD (change it in the /api/create-order request body) · 金额：$10.00 USD（可在 /api/create-order 入参中修改）</p>
  <div id="paypal-button-container"></div>
  <div id="status" data-en="Waiting for payment…" data-zh="等待支付……">Waiting for payment… · 等待支付……</div>

  <!-- 中英切换：共享脚本（默认双语，可切纯英文/纯中文） -->
  <script src="/static/js/i18n.js"></script>

  <!-- 官方 JS SDK：client-id 由后端从 .env 注入 -->
  <script src="https://www.paypal.com/sdk/js?client-id={{CLIENT_ID}}&currency=USD&intent=capture"></script>
  <script>
    paypal.Buttons({
      createOrder: async () => {
        const res = await fetch("/api/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: 10.0 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || MPLang.T("Failed to create order", "创建订单失败"));
        return data.id;
      },
      onApprove: async (data) => {
        const res = await fetch(`/api/capture-order/${data.orderID}`, { method: "POST" });
        const result = await res.json();
        const box = document.getElementById("status");
        const s = result.status || JSON.stringify(result);
        box.textContent = MPLang.T("Payment status: " + s, "支付状态：" + s);
      },
      onError: (err) => {
        document.getElementById("status").textContent = MPLang.T("Error: " + err, "错误：" + err);
      }
    }).render("#paypal-button-container");
  </script>
</body>
</html>
