<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandatePay · PayPal Sandbox Checkout</title>
  <style>
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1a2433; }
    h1 { font-size: 22px; color: #003087; }
    #status { margin-top: 16px; padding: 10px 12px; border-radius: 6px; background: #f0f4fa; font-size: 14px; white-space: pre-wrap; }
    nav.top { margin-bottom:16px; font-size:14px; }
    nav.top a { color:#0070ba; margin-right:16px; text-decoration:none; }
    nav.top a:hover { text-decoration:underline; }
    nav.top a.current { color:#1a2433; font-weight:600; }
  </style>
</head>
<body>
  <nav class="top"><a class="current" href="/">· Pay 支付测试</a><a href="/constraints">· Constraints 约束设定</a><a href="/budget">· Budget 预算仪表盘</a><a href="/approvals">· Approvals 审批台</a><a href="/audit">· Audit 审计日志</a><a href="https://github.com/niu602/mandatepay" target="_blank" rel="noopener">· Source 源码</a></nav>
  <h1>MandatePay · PayPal Sandbox Checkout 沙箱支付测试</h1>
  <p>Amount: $10.00 USD (change it in the /api/create-order request body) · 金额：$10.00 USD（可在 /api/create-order 入参中修改）</p>
  <div id="paypal-button-container"></div>
  <div id="status">Waiting for payment… · 等待支付……</div>

  <!-- 官方 JS SDK：client-id 由后端从 .env 注入 -->
  <script src="https://www.paypal.com/sdk/js?client-id={{CLIENT_ID}}&currency=USD&intent=capture"></script>
  <script>
    paypal.Buttons({
      createOrder: async () => {
        const res = await fetch("/api/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount: 10.0 })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to create order · 创建订单失败");
        return data.id;
      },
      onApprove: async (data) => {
        const res = await fetch(`/api/capture-order/${data.orderID}`, { method: "POST" });
        const result = await res.json();
        document.getElementById("status").textContent =
          "Payment status: " + (result.status || JSON.stringify(result)) + " · 支付状态";
      },
      onError: (err) => {
        document.getElementById("status").textContent = "Error: " + err + " · 错误";
      }
    }).render("#paypal-button-container");
  </script>
</body>
</html>
